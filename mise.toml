# https://mise.jdx.dev/

# Five days gives the community time to catch a compromised or broken release
# first. mise applies this only to versions it resolves itself (`latest`, a
# prefix like `22`, npm dependencies); an exact pin below is exempt, so check a
# release's age by hand before bumping one.
# https://mise.jdx.dev/configuration/settings.html#minimum_release_age
[settings]
minimum_release_age = "5d"

[tools]
python = "3.11"
# rulesync generates CLAUDE.md, AGENTS.md and the skills from .rulesync/.
# The generated files are gitignored; lefthook regenerates them.
# https://github.com/dyoshikawa/rulesync
"npm:rulesync" = "27.0.0"
# The openspec CLI creates, validates and archives the feature designs and command-group specs under openspec/. The openspec-* skills in .rulesync/skills/ run it.
# https://github.com/Fission-AI/OpenSpec
"npm:@fission-ai/openspec" = "1.14.1"
# lefthook runs the git hooks in lefthook.yml.
# https://github.com/evilmartians/lefthook
lefthook = "2.2.1"
# Same version as rust-toolchain.toml, so mise and rustup users get one compiler.
# The workspace needs Rust 1.89 or newer (uuid 1.27's minimum), and the code uses let-chains
# (`if let ... && ...`), which older compilers reject.
rust = "1.99.0"
# Secrets: fnox resolves fnox.toml's 1Password references (op) into an
# age-encrypted local cache. See docs/dev/environment-variables.md.
fnox = "1.38.1"
1password-cli = "2.40.0"
# age provides age-keygen for the one-time machine setup.
age = "1.3.2"
# The test runner the pre-commit checks use. aqua downloads nextest's
# prebuilt release, so nobody compiles it.
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
# Generates CHANGELOG.md; the release workflow and docs/dev/README.md call it.
git-cliff = "2.14.2"
# GitHub CLI, used by the worktree cleanup task and the issue workflow skills.
gh = "2.102.0"
# rulesync is a Node CLI (v27 declares node >=22); without Node its executable
# cannot run on a clean host.
node = "22"

# Install the lefthook git hooks on entering this repo. Running it again is
# harmless.
# https://mise.jdx.dev/hooks.html
[hooks]
enter = "lefthook install"

[env]
# Test fixture names are not secrets, so they live here rather than in 1Password.
REPOSITORY_OWNER = "codekiln"
REPOSITORY_NAME = "langstar"
# Only the repo-local bin. $HOME/.local/bin is deliberately absent: a stale
# ~/.local/bin/rulesync would shadow the pinned npm:rulesync above.
_.path = ["{{ config_root }}/.local/bin"]
