# mise.toml - Tool version management for Langstar project
# https://mise.jdx.dev/

[tools]
python = "3.11"
# rulesync generates CLAUDE.md, AGENTS.md and the skills from .rulesync/.
# The generated files are gitignored; lefthook regenerates them.
# https://github.com/dyoshikawa/rulesync
"npm:rulesync" = "27.0.0"
# lefthook runs the git hooks in lefthook.yml.
# https://github.com/evilmartians/lefthook
lefthook = "2.2.1"
# Secrets: fnox resolves fnox.toml's 1Password references (op) into an
# age-encrypted local cache. See docs/dev/environment-variables.md.
fnox = "1.38.1"
1password-cli = "2.40.0"
# age provides age-keygen for the one-time machine setup.
age = "1.3.2"
# The test runner the pre-commit checks use. aqua downloads nextest's
# prebuilt release, so nobody compiles it.
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"

# Rust is managed by devcontainer feature (ghcr.io/devcontainers/features/rust:1)
# Not managed by mise to avoid duplicate installation

# Node.js version matches devcontainer base image
# Managed by devcontainer, not by mise
# node = "22"

# Install the lefthook git hooks on entering this repo. Running it again is
# harmless.
# https://mise.jdx.dev/hooks.html
[hooks]
enter = "lefthook install"

[env]
# Test fixture names are not secrets, so they live here rather than in 1Password.
REPOSITORY_OWNER = "codekiln"
REPOSITORY_NAME = "langstar"
# Only the repo-local bin. $HOME/.local/bin is deliberately absent: a stale
# ~/.local/bin/rulesync would shadow the pinned npm:rulesync above.
_.path = ["{{ config_root }}/.local/bin"]
