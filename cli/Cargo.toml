[package]
name = "langstar"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for unified access to LangChain ecosystem"

[[bin]]
name = "langstar"
path = "src/main.rs"

[dependencies]
langstar-sdk = { path = "../sdk" }

# CLI framework
clap.workspace = true

# Async runtime
tokio.workspace = true
futures-util = "0.3"

# Date/time and UUID
chrono.workspace = true
chrono-tz = "0.10"
uuid.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit = "0.22"
csv = "1.3"

# Output formatting
tabled.workspace = true
colored = "2.1"

# Error handling
anyhow.workspace = true

# Config file handling
dirs = "5.0"

# Secure input for secrets
rpassword = "7.4"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"
escargot = "0.5"
serial_test = "3"
# Enable test-utils feature for shared test infrastructure
langstar-sdk = { path = "../sdk", features = ["test-utils"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[features]
# Feature flag to enable integration tests that require API access
integration-tests = []
