name: Prepare release

# On every push to main, release-plz tags the version if a release pull request
# just merged, then opens or updates the next release pull request.
# release-plz does both with the release GitHub App's token, so GitHub runs CI on
# the pull request and starts release.yml for the tag. docs/dev/releases.md explains the setup.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: app-token
        name: Create the release App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # https://mise.jdx.dev/continuous-integration.html#github-actions
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.2
          install_args: release-plz

      - name: Tag the version from a merged release pull request
        env:
          GIT_TOKEN: ${{ steps.app-token.outputs.token }}
        run: mise run release:publish

      - name: Open or update the release pull request
        env:
          GIT_TOKEN: ${{ steps.app-token.outputs.token }}
        run: mise run release:prepare
