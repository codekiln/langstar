name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.5.1)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# When someone starts this workflow by hand with `-f tag=<tag>`, every job works on
# that tag's commit, whichever branch the workflow file came from. A maintainer can
# then run a corrected copy of this workflow from another branch to rebuild a
# release that already exists.
jobs:
  verify-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Check job
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ inputs.tag || github.sha }}
          check-name: 'Check'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success

      - name: Wait for Test job
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ inputs.tag || github.sha }}
          check-name: 'Test'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success

      - name: Wait for Clippy job
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ inputs.tag || github.sha }}
          check-name: 'Clippy'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success

      - name: Wait for Build jobs
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ inputs.tag || github.sha }}
          check-regexp: 'Build \(.*\)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success

  pre-release-validation:
    name: Pre-Release Validation
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run full lifecycle deployment test
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_ORGANIZATION_ID: ${{ secrets.LANGSMITH_ORGANIZATION_ID }}
          LANGSMITH_WORKSPACE_ID: ${{ secrets.LANGSMITH_WORKSPACE_ID }}
        run: |
          cargo test --test integration_deployment_workflow \
            test_deployment_workflow_full_lifecycle -- \
            --ignored --nocapture

  create-release:
    name: Create Release
    needs: [verify-ci, pre-release-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag }}"
            VERSION="${TAG_NAME#v}"
          else
            TAG_NAME="${{ github.ref_name }}"
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG_NAME, Version: $VERSION"

      # Validate tag matches Cargo.toml version
      # Prevents publishing releases with mismatched versions (learned from PR #239)
      - name: Validate tag matches Cargo.toml version
        run: |
          TAG_VERSION="${{ steps.get_version.outputs.version }}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "❌ Version mismatch detected!" >&2
            echo "   Tag version:        $TAG_VERSION" >&2
            echo "   Cargo.toml version: $CARGO_VERSION" >&2
            echo "" >&2
            echo "This usually means the prepare-release workflow was not used," >&2
            echo "or the tag was created manually without updating Cargo.toml." >&2
            exit 1
          fi

          echo "✅ Version validation passed: $TAG_VERSION"

      # prepare-release.yml writes this section with git-cliff, and a maintainer
      # edits it in the release pull request before merging.
      - name: Take the release notes from CHANGELOG.md
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          awk -v heading="## [$VERSION]" '
            /^## \[/ { if (found) exit; if (index($0, heading) == 1) found = 1 }
            found
          ' CHANGELOG.md > CHANGELOG_ENTRY.md
          if [ ! -s CHANGELOG_ENTRY.md ]; then
            echo "❌ CHANGELOG.md has no section headed '## [$VERSION]'" >&2
            exit 1
          fi
          cat CHANGELOG_ENTRY.md

      # If the tag has no release yet, create a draft for a maintainer to publish.
      # If it has one, replace only the notes, so rebuilding a published release
      # doesn't turn it back into a draft.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.tag_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file CHANGELOG_ENTRY.md
          else
            PRERELEASE=()
            case "$TAG" in *-alpha*|*-beta*|*-rc*) PRERELEASE=(--prerelease) ;; esac
            gh release create "$TAG" --verify-tag --draft --title "Release $TAG" \
              --notes-file CHANGELOG_ENTRY.md "${PRERELEASE[@]}"
          fi

  build-release:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (musl for static linking)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: langstar
            asset_platform: x86_64-linux-musl

          # Linux ARM64 (musl for static linking)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: langstar
            asset_platform: aarch64-linux-musl

          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: langstar
            asset_platform: aarch64-macos

          # TODO: Add more platforms after these work
          # - x86_64-unknown-linux-gnu (Linux gnu)
          # - x86_64-apple-darwin (macOS Intel)
          # - x86_64-pc-windows-msvc (Windows)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # cargo builds with the Rust version that rust-toolchain.toml pins, not the
      # stable toolchain the step above installed. Run inside the checkout,
      # `rustup target add` adds the build target to that pinned version.
      - name: Add the build target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools (Linux x86_64 musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools (Linux ARM64 musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
          # Configure cargo to use the ARM64 linker
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            # Use ARM64-specific strip for cross-compiled binaries
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }} || true
          else
            # Use default strip for native builds
            strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }} || true
          fi

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          ASSET_NAME="langstar-${{ needs.create-release.outputs.version }}-${{ matrix.asset_platform }}"
          tar czf "$ASSET_NAME.tar.gz" ${{ matrix.artifact_name }}
          shasum -a 256 "$ASSET_NAME.tar.gz" > "$ASSET_NAME.tar.gz.sha256"
          mv "$ASSET_NAME.tar.gz" "$ASSET_NAME.tar.gz.sha256" ../../..

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          ASSET_NAME="langstar-${{ needs.create-release.outputs.version }}-${{ matrix.asset_platform }}"
          7z a "$ASSET_NAME.zip" ${{ matrix.artifact_name }}
          sha256sum "$ASSET_NAME.zip" > "$ASSET_NAME.zip.sha256"
          mv "$ASSET_NAME.zip" "$ASSET_NAME.zip.sha256" ../../..

      # `gh release upload` adds or replaces the files and leaves the release's draft
      # state alone, so a new release stays a draft until a maintainer publishes it.
      - name: Upload release asset (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: langstar-${{ needs.create-release.outputs.version }}-${{ matrix.asset_platform }}.tar.gz
        run: |
          gh release upload "${{ needs.create-release.outputs.tag_name }}" "$ASSET" "$ASSET.sha256" --clobber

      - name: Upload release asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: langstar-${{ needs.create-release.outputs.version }}-${{ matrix.asset_platform }}.zip
        run: |
          gh release upload "${{ needs.create-release.outputs.tag_name }}" "$ASSET" "$ASSET.sha256" --clobber
