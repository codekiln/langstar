name: Release checks

# release.yml, which dist generates, calls this workflow in its plan job, so a
# release builds only when the release configuration checks pass.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # https://mise.jdx.dev/continuous-integration.html#github-actions
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.2
          install_args: release-plz cargo-dist
      - name: Check the release-plz and cargo-dist configuration
        run: mise run release:check
