name: Test DevContainer Features

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/features/**'
  push:
    tags:
      - 'v*'  # Test when binary releases happen
  pull_request:
    paths:
      - '.devcontainer/features/**'
  workflow_dispatch:  # Allow manual testing

env:
  # Feature configuration
  FEATURE_BASE_PATH: '.devcontainer/features'

jobs:
  test-features:
    name: Test Features (${{ matrix.baseImage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        baseImage:
          - 'mcr.microsoft.com/devcontainers/base:ubuntu-22.04'
          - 'mcr.microsoft.com/devcontainers/base:ubuntu-24.04'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Verify Dev Container CLI installation
        run: |
          echo "Dev Container CLI version:"
          devcontainer --version

      - name: List features to test
        id: list-features
        run: |
          echo "Discovering features in ${{ env.FEATURE_BASE_PATH }}..."
          if [ ! -d "${{ env.FEATURE_BASE_PATH }}" ]; then
            echo "Error: Feature directory not found: ${{ env.FEATURE_BASE_PATH }}"
            exit 1
          fi
          features=$(find ${{ env.FEATURE_BASE_PATH }} -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)
          if [ -z "$features" ]; then
            echo "Warning: No features found in ${{ env.FEATURE_BASE_PATH }}"
            exit 0
          fi
          echo "Features found:"
          echo "$features"
          # Note: The 'features' output is not used by subsequent steps in this scaffolding workflow.
          # Future PRs will reference this output (see #248, #250, #251).
          echo "features<<EOF" >> $GITHUB_OUTPUT
          echo "$features" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Test feature installation
        run: |
          echo "Testing features on base image: ${{ matrix.baseImage }}"
          echo "============================================"

          # Get list of features to test
          if [ ! -d "${{ env.FEATURE_BASE_PATH }}" ]; then
            echo "Error: Feature directory not found: ${{ env.FEATURE_BASE_PATH }}"
            exit 1
          fi

          # Find all features
          features=$(find ${{ env.FEATURE_BASE_PATH }} -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)
          if [ -z "$features" ]; then
            echo "Warning: No features found in ${{ env.FEATURE_BASE_PATH }}"
            exit 0
          fi

          # Get absolute path to features directory
          FEATURES_ABS_PATH=$(cd "${{ env.FEATURE_BASE_PATH }}" && pwd)
          echo "Features directory: ${FEATURES_ABS_PATH}"

          # Test each feature
          for feature in $features; do
            echo ""
            echo "=========================================="
            echo "Testing feature: ${feature}"
            echo "=========================================="

            # Create temporary directory for test devcontainer
            TEST_DIR=$(mktemp -d -t "test-${feature}-XXXXXX")
            echo "Created test directory: ${TEST_DIR}"

            # Create test devcontainer.json that references the local feature
            cat > "${TEST_DIR}/.devcontainer.json" <<EOF
          {
            "name": "Test ${feature}",
            "image": "${{ matrix.baseImage }}",
            "features": {
              "${FEATURES_ABS_PATH}/${feature}": {}
            }
          }
          EOF

            echo "Created test devcontainer.json:"
            cat "${TEST_DIR}/.devcontainer.json"
            echo ""

            # Build and start container with feature using Dev Container CLI
            echo "Building and starting test container with ${feature} feature..."
            echo "This will:"
            echo "  1. Pull base image: ${{ matrix.baseImage }}"
            echo "  2. Install feature: ${feature}"
            echo "  3. Verify installation"
            echo ""

            if devcontainer up \
              --workspace-folder "${TEST_DIR}" \
              --log-level trace \
              2>&1 | tee "${TEST_DIR}/build.log"; then
              echo "✓ Container build and startup successful"
            else
              echo "✗ Container build/startup failed"
              echo ""
              echo "=== Build Log ==="
              cat "${TEST_DIR}/build.log"
              echo "================="
              rm -rf "${TEST_DIR}"
              exit 1
            fi
            echo ""

            # Execute commands inside container to verify installation
            echo "Verifying ${feature} installation..."
            echo "Running: command -v ${feature} && ${feature} --version"

            if devcontainer exec \
              --workspace-folder "${TEST_DIR}" \
              --log-level trace \
              bash -c "command -v ${feature} && ${feature} --version" \
              2>&1 | tee "${TEST_DIR}/exec.log"; then
              echo "✓ ${feature} command verified successfully"
            else
              echo "✗ ${feature} command verification failed"
              echo ""
              echo "=== Execution Log ==="
              cat "${TEST_DIR}/exec.log"
              echo "===================="
              rm -rf "${TEST_DIR}"
              exit 1
            fi
            echo ""

            echo "✓ Feature ${feature} passed all tests"

            # Clean up this feature's test directory
            echo "Cleaning up test directory: ${TEST_DIR}"
            rm -rf "${TEST_DIR}"
          done

          echo ""
          echo "=========================================="
          echo "All features tested successfully!"
          echo "=========================================="

      - name: Report results
        if: always()
        run: |
          echo "Feature testing completed for base image: ${{ matrix.baseImage }}"
          echo "Status: ${{ job.status }}"
