name: CI

on:
  push:
    branches: [main]
    # Skip CI when only documentation or non-code files are modified
    # See: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onpushpull_requestpull_request_targetpathspaths-ignore
    paths-ignore:
      - '**/*.md'           # Markdown files
      - 'docs/**'           # Documentation directory
      - '*.txt'             # Text files (LICENSE, etc.)
      - '.gitignore'        # Git ignore file
      - '.github/**/*.md'   # GitHub-specific markdown docs
  pull_request:
    branches: [main]
    # Skip CI when only documentation or non-code files are modified
    paths-ignore:
      - '**/*.md'           # Markdown files
      - 'docs/**'           # Documentation directory
      - '*.txt'             # Text files (LICENSE, etc.)
      - '.gitignore'        # Git ignore file
      - '.github/**/*.md'   # GitHub-specific markdown docs

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run cargo check
        run: cargo check --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --all-features --workspace --lib
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_ORGANIZATION_ID: ${{ secrets.LANGSMITH_ORGANIZATION_ID }}
          LANGSMITH_WORKSPACE_ID: ${{ secrets.LANGSMITH_WORKSPACE_ID }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    # Only run on PRs and main branch to avoid excessive API usage
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run integration tests
        run: cargo test --features integration-tests --test assistant_command_test --test graph_command_test -- --test-threads=1 --nocapture
        timeout-minutes: 15
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_WORKSPACE_ID: ${{ secrets.LANGSMITH_WORKSPACE_ID }}
          LANGGRAPH_GITHUB_INTEGRATION_ID: ${{ secrets.LANGGRAPH_GITHUB_INTEGRATION_ID }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run security audit
        run: cargo audit

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --all-features

      - name: Upload binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: langstar-linux
          path: target/release/langstar

      - name: Upload binary (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: langstar-macos
          path: target/release/langstar

  # Check if devcontainer features need republishing
  # This job warns but does NOT fail - there may be legitimate reasons to delay publishing
  # (e.g., waiting for a CLI release first)
  check-feature-publish-status:
    name: Check Feature Publish Status
    runs-on: ubuntu-latest
    # Only run on PRs to provide visibility during review
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history to compare commits

      - name: Check if features need republishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get last successful release-features.yaml run commit
          LAST_PUBLISH=$(gh run list --workflow=release-features.yaml --status=success --json headSha --jq '.[0].headSha' 2>/dev/null || echo "")

          if [ -z "$LAST_PUBLISH" ]; then
            echo "::notice::No previous feature publish found"
            exit 0
          fi

          # Check if feature files changed since last publish
          CHANGED=$(git diff --name-only "$LAST_PUBLISH" HEAD -- .devcontainer/features/ 2>/dev/null || echo "")

          if [ -n "$CHANGED" ]; then
            echo "::warning title=Devcontainer Features Need Republishing::Feature files have changed since last publish. After merging, run: gh workflow run release-features.yaml"
            echo ""
            echo "Changed files since last publish ($LAST_PUBLISH):"
            echo "$CHANGED"
            echo ""
            echo "To republish after merge:"
            echo "  gh workflow run release-features.yaml"
          else
            echo "✓ Devcontainer features are up to date with published version"
          fi

  # ⚠️ CRITICAL: DO NOT REMOVE THIS JOB
  # This job aggregates all CI results into a single "All Jobs" check.
  # Branch protection requires this check - removing it will block ALL merges to main.
  #
  # When adding/removing jobs above:
  # 1. Update the 'needs' list below to include all CI jobs
  # 2. Test that "All Jobs" check still appears in PRs
  # 3. See .github/workflows/README.md for complete procedure
  all-jobs:
    name: All Jobs
    if: always()
    runs-on: ubuntu-latest
    needs:
      - check
      - test
      - integration-tests
      - clippy
      - audit
      - build
    steps:
      - name: Check all job results
        run: |
          jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< '${{ toJson(needs) }}'
