name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # NOTE: path-ignore removed in favor of job-level path filtering (see #640)
    # This allows us to override path filters for release branches while
    # still skipping CI for docs-only changes on regular PRs

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Permissions needed for publish-unit-test-result-action
# See: https://github.com/EnricoMi/publish-unit-test-result-action#permissions
permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  # Determines whether to run CI based on changed files and branch name
  # Always runs CI for release branches (created by prepare-release workflow)
  # Skips CI for docs-only changes on regular PRs
  # See issue #640: https://github.com/codekiln/langstar/issues/640
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # Set job outputs for use in downstream jobs
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if release branch or code changed
        id: filter
        run: |
          # Always run CI for release preparation branches (created by prepare-release workflow)
          # Branch pattern: release/v{version} (e.g., release/v1.2.3)
          # See: .github/workflows/prepare-release.yml:241
          if [[ "${{ github.head_ref }}" == release/* ]] || [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "Release branch detected - running CI regardless of changed files"
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # For non-release branches, check if any non-docs files changed
          # Skip CI if only these file patterns changed:
          # - **/*.md (markdown files)
          # - docs/** (documentation directory)
          # - *.txt (text files in root)
          # - .gitignore

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Get list of changed files in PR
            CHANGED_FILES=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path' 2>/dev/null || echo "")
            if [ -z "$CHANGED_FILES" ]; then
              echo "Warning: Could not fetch changed files, running CI as a precaution"
              echo "should_run=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            # Check if any files outside the ignore patterns changed
            NON_DOCS_CHANGED=false
            while IFS= read -r file; do
              # Skip if file matches ignore patterns
              if [[ "$file" == *.md ]] || \
                 [[ "$file" == docs/* ]] || \
                 [[ "$file" == *.txt && ! "$file" =~ / ]] || \
                 [[ "$file" == ".gitignore" ]]; then
                continue
              fi
              # Found a non-docs file
              NON_DOCS_CHANGED=true
              break
            done <<< "$CHANGED_FILES"

            if [[ "$NON_DOCS_CHANGED" == "true" ]]; then
              echo "Code files changed - running CI"
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "Only docs/non-code files changed - skipping CI"
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          else
            # For push events to main, always run
            echo "Push to main - running CI"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run cargo check
        run: cargo check --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run unit tests
        run: cargo nextest run --profile ci --all-features --workspace --lib
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_ORGANIZATION_ID: ${{ secrets.LANGSMITH_ORGANIZATION_ID }}
          LANGSMITH_WORKSPACE_ID: ${{ secrets.LANGSMITH_WORKSPACE_ID }}

      - name: List test artifacts
        if: always()
        run: |
          echo "=== JUnit XML file ==="
          ls -la target/nextest/ci/junit-ci.xml 2>/dev/null || echo "No JUnit XML file found"

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: target/nextest/ci/junit-ci.xml
          check_name: "Unit Test Results"
          comment_title: "Unit Test Results"
          time_unit: seconds
          report_individual_runs: true
          # Don't fail if no test results (e.g., all tests skipped)
          action_fail_on_inconclusive: false

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-${{ github.run_number }}
          path: target/nextest/ci/junit-ci.xml
          retention-days: 90
          if-no-files-found: warn

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [changes, test]
    # Only run when changes warrant CI AND (on PRs or main branch) to avoid excessive API usage
    if: needs.changes.outputs.should_run == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run integration tests
        # Runs ALL CLI integration tests in the langstar package
        # Tests marked with #[cfg_attr(not(feature = "integration-tests"), ignore)] will run
        # Note: The serial_test crate's #[serial] attribute works at the process level.
        # Nextest runs each test in its own process, so #[serial] coordination works correctly.
        run: cargo nextest run --profile integration -p langstar --features integration-tests
        timeout-minutes: 15
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_ORGANIZATION_ID: ${{ secrets.LANGSMITH_ORGANIZATION_ID }}
          LANGSMITH_WORKSPACE_ID: ${{ secrets.LANGSMITH_WORKSPACE_ID }}

      - name: List test artifacts
        if: always()
        run: |
          echo "=== JUnit XML file ==="
          ls -la target/nextest/integration/junit-integration.xml 2>/dev/null || echo "No JUnit XML file found"

      - name: Publish Integration Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: target/nextest/integration/junit-integration.xml
          check_name: "Integration Test Results"
          comment_title: "Integration Test Results"
          time_unit: seconds
          report_individual_runs: true
          action_fail_on_inconclusive: false

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results-${{ github.run_number }}
          path: target/nextest/integration/junit-integration.xml
          retention-days: 90
          if-no-files-found: warn

  integration-tests-sdk:
    name: SDK Integration Tests
    runs-on: ubuntu-latest
    needs: [changes, test]
    # Only run when changes warrant CI AND (on PRs or main branch) to avoid excessive API usage
    if: needs.changes.outputs.should_run == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run SDK integration tests
        # Runs ALL SDK integration tests in the langstar-sdk package
        # Tests marked with #[cfg_attr(not(feature = "integration-tests"), ignore)] will run
        # Requires test-utils feature for shared test infrastructure (deployment helpers, etc.)
        run: cargo nextest run --profile integration -p langstar-sdk --features integration-tests,test-utils
        timeout-minutes: 15
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_ORGANIZATION_ID: ${{ secrets.LANGSMITH_ORGANIZATION_ID }}
          LANGSMITH_WORKSPACE_ID: ${{ secrets.LANGSMITH_WORKSPACE_ID }}

      - name: List test artifacts
        if: always()
        run: |
          echo "=== JUnit XML file ==="
          ls -la target/nextest/integration/junit-integration.xml 2>/dev/null || echo "No JUnit XML file found"

      - name: Publish SDK Integration Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: target/nextest/integration/junit-integration.xml
          check_name: "SDK Integration Test Results"
          comment_title: "SDK Integration Test Results"
          time_unit: seconds
          report_individual_runs: true
          action_fail_on_inconclusive: false

      - name: Upload SDK integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-integration-test-results-${{ github.run_number }}
          path: target/nextest/integration/junit-integration.xml
          retention-days: 90
          if-no-files-found: warn

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run security audit
        run: cargo audit

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --all-features

      - name: Upload binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: langstar-linux
          path: target/release/langstar

      - name: Upload binary (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: langstar-macos
          path: target/release/langstar

  # Check if devcontainer features need republishing
  # This job warns but does NOT fail - there may be legitimate reasons to delay publishing
  # (e.g., waiting for a CLI release first)
  check-feature-publish-status:
    name: Check Feature Publish Status
    runs-on: ubuntu-latest
    needs: changes
    # Only run on PRs when changes warrant CI (provides visibility during review)
    if: needs.changes.outputs.should_run == 'true' && github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history to compare commits

      - name: Check if features need republishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get last successful release-features.yaml run commit
          LAST_PUBLISH=$(gh run list --workflow=release-features.yaml --status=success --json headSha --jq '.[0].headSha' 2>/dev/null || echo "")

          if [ -z "$LAST_PUBLISH" ]; then
            echo "::notice::No previous feature publish found"
            exit 0
          fi

          # Check if feature files changed since last publish
          CHANGED=$(git diff --name-only "$LAST_PUBLISH" HEAD -- .devcontainer/features/ 2>/dev/null || echo "")

          if [ -n "$CHANGED" ]; then
            echo "::warning title=Devcontainer Features Need Republishing::Feature files have changed since last publish. After merging, run: gh workflow run release-features.yaml"
            echo ""
            echo "Changed files since last publish ($LAST_PUBLISH):"
            echo "$CHANGED"
            echo ""
            echo "To republish after merge:"
            echo "  gh workflow run release-features.yaml"
          else
            echo "✓ Devcontainer features are up to date with published version"
          fi

  # ⚠️ CRITICAL: DO NOT REMOVE THIS JOB
  # This job aggregates all CI results into a single "All Jobs" check.
  # Branch protection requires this check - removing it will block ALL merges to main.
  #
  # When adding/removing jobs above:
  # 1. Update the 'needs' list below to include all CI jobs
  # 2. Test that "All Jobs" check still appears in PRs
  # 3. See .github/workflows/README.md for complete procedure
  all-jobs:
    name: All Jobs
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - check
      - test
      - integration-tests
      - integration-tests-sdk
      - clippy
      - audit
      - build
    steps:
      - name: Check all job results
        run: |
          jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< '${{ toJson(needs) }}'
