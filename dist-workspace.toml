[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Where to host releases
hosting = "github"
# Build and retain release artifacts when validating pull requests.
pr-run-mode = "upload"

# GitHub no longer runs jobs on macos-14, the runner dist picks by default.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
