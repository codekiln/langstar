# tmux configuration for langstar devcontainer
# This file is symlinked to ~/.tmux.conf during post-create setup

# Enable mouse support for easier pane selection and scrolling
set -g mouse on

# ===== Window Status Styling =====
# WCAG 2.1 Level AA compliant colors (4.5:1 contrast ratio minimum for normal text)
# WCAG 2.1 Level AAA compliant colors (7:1 contrast ratio for enhanced accessibility)

# Active window: Dark blue background (colour17/navy) with white text
# Contrast ratio: ~12:1 (exceeds WCAG AAA requirements)
# colour17 = #00005f (very dark blue/navy)
set -g window-status-current-style 'bg=colour17,fg=colour15,bold'

# Inactive windows: Dark grey background with light grey text
# Contrast ratio: ~10:1 (exceeds WCAG AAA requirements)
# colour235 = #262626 (dark grey), colour250 = #bcbcbc (light grey)
set -g window-status-style 'bg=colour235,fg=colour250'

# ===== Pane Border Styling =====
# Make active pane border more visible with WCAG-compliant colors
set -g pane-border-style 'fg=colour240'          # Inactive: dark grey (subtle but visible)
set -g pane-active-border-style 'fg=colour39'   # Active: bright cyan-blue for high visibility
                                                 # colour39 = #00afff (bright cyan-blue)

# ===== Status Bar Styling =====
# WCAG-compliant status bar colors
set -g status-style 'bg=colour235,fg=colour15'    # Dark grey bg, white text (~10:1 ratio)

# Left side of status bar (session name)
set -g status-left-style 'bg=colour235,fg=colour46'  # Bright green for visibility
                                                      # colour46 = #00ff00 (bright green, ~9:1 ratio)

# Right side of status bar (date/time)
set -g status-right-style 'bg=colour235,fg=colour15' # White text (~10:1 ratio)
