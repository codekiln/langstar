# tmux configuration for langstar devcontainer
# This file is symlinked to ~/.tmux.conf during post-create setup

# Enable mouse support for easier pane selection and scrolling
set -g mouse on

# ===== Window Status Styling =====
# Highlight the active window with a different background color
# Active window: bright blue background with white text
set -g window-status-current-style 'bg=blue,fg=white,bold'

# Inactive windows: default colors
set -g window-status-style 'bg=default,fg=white'

# ===== Pane Border Styling =====
# Make active pane border more visible
set -g pane-border-style 'fg=colour240'        # Inactive pane borders: dark grey
set -g pane-active-border-style 'fg=blue,bold' # Active pane border: bright blue

# ===== Status Bar Styling =====
# Status bar colors
set -g status-style 'bg=colour235,fg=white'

# Left side of status bar (session name)
set -g status-left-style 'bg=colour235,fg=green'

# Right side of status bar (date/time)
set -g status-right-style 'bg=colour235,fg=white'
