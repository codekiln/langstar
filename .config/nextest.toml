# Configuration for cargo-nextest
# See: https://nexte.st/book/configuration.html

[store]
# Store directory for test artifacts
dir = "target/nextest"

# Default profile settings
[profile.default]
# Test timeout (2 minutes for unit tests)
slow-timeout = { period = "60s", terminate-after = 2 }
# Show output for failed tests
failure-output = "immediate-final"
success-output = "never"
# Number of retries for flaky tests (disabled by default)
retries = 0

# CI profile - used for automated testing with JUnit output
[profile.ci]
# Store output for all tests (needed for debugging CI failures)
failure-output = "immediate-final"
success-output = "never"
# Fail-fast disabled in CI to see all failures
fail-fast = false
# Generate JUnit XML report for test results
[profile.ci.junit]
path = "target/nextest/ci/junit.xml"
# Store success/failure status per test
store-success-output = true
store-failure-output = true

# Integration test profile - longer timeouts for API calls
[profile.integration]
# Integration tests may need longer timeouts due to network calls
slow-timeout = { period = "180s", terminate-after = 2 }
# Show output for integration tests (useful for debugging)
failure-output = "immediate-final"
success-output = "never"
# Fail-fast disabled to see all integration test failures
fail-fast = false
# Generate JUnit XML report
[profile.integration.junit]
path = "target/nextest/integration/junit.xml"
store-success-output = true
store-failure-output = true
